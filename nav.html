<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combined Navbar Example</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --primary-color: #0a66c2;
      --text-color: #333;
    }
    
    /* Navbar Styles */
    .navbar {
      position: relative;
      top: 15px;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 15px 0;
      transition: all 0.3s ease;
    }

    .navbar.scrolled {
      padding: 10px 0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .navbar-container {
      display: flex;
      justify-content:space-around;
      align-items: center;
      max-width: 2600px;
      margin: 0 auto;
      padding: 0 7%;
      position: relative;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-color);
      text-decoration: none;
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 150px;
      justify-content: flex-start; /* Align logo to left */
      z-index: 9999;
    }
      
    /* Active state for nav links */
    .nav-links li.active a {
      color: var(--primary-color);
    }

    .nav-links li.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: var(--primary-color);
      transition: width 0.3s ease-in-out;
    }

    /* Services dropdown active state */
    .nav-links li.services-dropdown.active > a {
      color: var(--primary-color);
    }

    /* Mobile menu active state */
    .nav-links.active li.active a {
      color: var(--primary-color);
    }


    .logo img {
      height: 50px;
      width: auto;
      margin-right: 10px;
    }

    .nav-links {
      display: flex;
      position: fixed;
      list-style: none;
      background-color: #fff;
      color: black;
      height: 6vh;
      width: 80vh;
      justify-content: space-around;
      align-items: center;
      border-radius: 3vh;
      left: 65vh;
      z-index: 9999;
      /* Border setup */
      padding: 2px; /* Creates space for the border */
      /* position: relative; Needed for absolute positioning of the pseudo-element */
      background-clip: padding-box; /* Prevents background from bleeding into border area */
    }

    .nav-links::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      z-index: -1;
      border: 3px solid #0a66c2 ;
      border-radius: 3vh;
    }
    .nav-links.no-border::before {
      border: none !important;
    }

    .nav-links li {
      margin: 0 15px;
      position: relative;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-color);
      font-weight: 400;
      transition: all 0.3s ease;
      padding: 5px 0;
      white-space: nowrap;
    }

    .nav-links a:hover {
      color: var(--primary-color);
      transition: transform 0.3s ease-in-out;
    }

    .nav-links li::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background-color: var(--primary-color);
      transition: width 0.3s ease-in-out;
    }

    .nav-links li:hover::after {
      width: 100%;
    }

    .services-mobile-links{
      display: none;
    }

    /* Services Dropdown Styles */
    .services-dropdown {
      position: relative;
      padding: 13px;
    }

    .services-dropdown-content {
      display: none;
      position: absolute;
      top: 70%;
      left: 50%;
      transform: translateX(-50%);
      background-color: white;
      min-width: 900px;
      padding:25px;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      z-index: 1001;
      margin-top: 20px;
      overflow-x: auto;
      white-space: nowrap;
      gap: 20px;
    }

    .services-dropdown:hover .services-dropdown-content {
      display: flex;
      flex-wrap: nowrap;
      /* gap: 20px; */
    }

    .service-card {
      background-color: #e6f0ff; /* Cool blue background */
      border: 2px solid #b8d4fe;
      border-radius: 10px;
      padding: 25px 20px;
      text-align: center;
      transition: all 0.3s ease;
      width: 170px; /* Fixed width */
      height: 210px; /* Fixed height */
      display: inline-flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .service-card:hover {
      background-color: white;
      border-color: #3a86ff;
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .service-icon {
      font-size: 2.8rem;
      color: #3a86ff;
      margin-bottom: 20px;
      flex-grow: 1;
      display: flex;
      align-items: center;
    }

    .service-name {
      font-weight: 600;
      color: #2d3748;
      font-size: 1.1rem;
      width: 100%;
      display: flex;
      justify-content: center;
      min-height: 60px; /* Fixed height for text */
      line-height: 1.3;
    }

    /* Mobile menu styles */
    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-color);
      cursor: pointer;
      z-index: 1001;
    }

    .nav-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 999;
    }

    /* Button styles */
    .btn1 {
      padding: 10px 20px;
      border-radius: 5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-outline {
      background-color: transparent;
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
    }

    .btn-outline:hover {
      background-color: var(--primary-color);
      color: white;
    }

    /* Responsive styles */
    @media (max-width: 768px) {
      .nav-links {
        position: fixed;
        top: 0;
        left: -100%;
        width: 80%;
        height: 100vh;
        flex-direction: column;
        justify-content: flex-start;
        padding-top: 80px;
        background-color: white;
        transition: all 0.3s ease;
        z-index: 1000;
        border-radius: 0;
      }

      .nav-links.active {
        left: 0;
      }

      .nav-links::before {
        display: none;
      }

      .nav-links li {
        margin: 15px 0;
      }

      .mobile-menu-btn {
        display: block;
      }

      .services-dropdown-content {
        display: none !important;
      }

      .services-mobile-links {
        display: none;
        flex-direction: column;
        padding: 10px;
      }

      .services-dropdown.active .services-mobile-links {
        display: flex;
      }

      .btn1 {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container navbar-container">
      <a href="#" class="logo">
        <img src="../assets/images/th.png" alt="Logo">
      </a>
      
      <ul class="nav-links" id="navLinks">
        <li><a href="../index.html">Home</a></li>
        <li><a href="./Company.html">Company</a></li>
        <li class="services-dropdown">
          <a href="#">Services <i class="fas fa-chevron-down"></i></a>
          <div class="services-dropdown-content">
            <a href="./webDevlopment.html"> <div class="service-card">
              <div class="service-icon">
                <i class="fas fa-code"></i>
              </div>
              <div class="service-name">Web Development</div>
            </div></a>

            <a href="./CustomSoftware.html"><div class="service-card">
              <div class="service-icon">
                <i class="fas fa-cogs"></i>
              </div>
              <div class="service-name">Custom Software<br/> Development</div>
            </div></a>

            <a href="./Marketing.html"><div class="service-card">
              <div class="service-icon">
                <i class="fas fa-bullhorn"></i>
              </div>
              <div class="service-name">Marketing Solution</div>
            </div></a>

             <a href="#"><div  class="service-card">
              <div class="service-icon">
                <i class="fas fa-paint-brush"></i>
              </div>
              <div class="service-name">Graphic Design</div>
            </div></a>
           
            <a href="./uiUxDesign.html"><div class="service-card">
              <div class="service-icon">
                <i class="fas fa-pencil-ruler"></i>
              </div>
              <div class="service-name">UI/UX Design</div>
            </div></a>
             <a href="./mobileApp.html"><div class="service-card">
              <div class="service-icon">
                <i class="fas fa-mobile-alt"></i>
              </div>
              <div class="service-name">Mobile App.<br/> Development</div>
            </div></a>
          </div>
        </li>
        <li><a href="./Work.html">Work</a></li>
        <li><a href="./Contact.html">Contact</a></li>
      </ul>
      
      <button class="btn1 btn-outline" id="becomeClientBtn">+ Become a Client</button>
      <button class="mobile-menu-btn" id="mobileMenuBtn">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </nav>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const mobileMenuBtn = document.getElementById('mobileMenuBtn');
      const navLinks = document.getElementById('navLinks');
      const servicesDropdown = document.querySelector('.services-dropdown');
      const navbar = document.querySelector('.navbar');
      
      // Create overlay element
      const overlay = document.createElement('div');
      overlay.className = 'nav-overlay';
      document.body.appendChild(overlay);

      // Track if services dropdown was clicked
      let servicesClicked = false;

      // Scroll event for navbar background
      window.addEventListener('scroll', function() {
        if (window.scrollY > 10) { // Adjust this value as needed
          navbar.classList.add('scrolled');
        } else {
          navbar.classList.remove('scrolled');
        }
      });

      // Mobile menu toggle
      mobileMenuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        navLinks.classList.toggle('active');
        overlay.style.display = navLinks.classList.contains('active') ? 'block' : 'none';
        mobileMenuBtn.innerHTML = navLinks.classList.contains('active') ? 
          '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
        document.body.style.overflow = navLinks.classList.contains('active') ? 'hidden' : 'auto';
      });

      // Close menu when clicking overlay
      overlay.addEventListener('click', () => {
        navLinks.classList.remove('active');
        overlay.style.display = 'none';
        mobileMenuBtn.innerHTML = '<i class="fas fa-bars"></i>';
        document.body.style.overflow = 'auto';
      });

      // Services dropdown functionality
      if (servicesDropdown) {
        const servicesLink = servicesDropdown.querySelector('a');
        const chevronIcon = servicesDropdown.querySelector('a i');
        const desktopContent = servicesDropdown.querySelector('.services-dropdown-content');
        const mobileContent = servicesDropdown.querySelector('.services-mobile-links');
        
        // Create mobile links if they don't exist
        if (!mobileContent) {
          const mobileLinks = document.createElement('div');
          mobileLinks.className = 'services-mobile-links';
          mobileLinks.innerHTML = `
            <a href="./pages/webDevlopment.html"><i class="fas fa-code"></i> Web Development</a>
            <a href="./pages/CustomSoftware.html"><i class="fas fa-cogs"></i> Custom Software</a>
            <a href="./pages/Marketing.html"><i class="fas fa-bullhorn"></i> Marketing Solution</a>
            <a href="./pages/GraphicDesign.html"><i class="fas fa-paint-brush"></i> Graphic Design</a>
            <a href="./pages/uiUxDesign.html"><i class="fas fa-pencil-ruler"></i> UI/UX Design</a>
            <a href="./pages/mobileApp.html"><i class="fas fa-mobile-alt"></i> Mobile App</a>
          `;
          servicesDropdown.appendChild(mobileLinks);
        }

        // Desktop hover behavior
        servicesDropdown.addEventListener('mouseenter', () => {
          if (window.innerWidth > 768 && !servicesClicked) {
            desktopContent.style.display = 'flex';
          }
        });
        
        servicesDropdown.addEventListener('mouseleave', () => {
          if (window.innerWidth > 768 && !servicesClicked) {
            desktopContent.style.display = 'none';
          }
        });
        
        // Desktop click behavior
        servicesLink.addEventListener('click', (e) => {
          if (window.innerWidth > 768) {
            e.preventDefault();
            servicesClicked = !servicesClicked;
            desktopContent.style.display = servicesClicked ? 'flex' : 'none';
            
            // Toggle chevron icon
            if (chevronIcon) {
              chevronIcon.classList.toggle('fa-chevron-down');
              chevronIcon.classList.toggle('fa-chevron-up');
            }
          }
        });

        // Mobile click behavior
        servicesLink.addEventListener('click', (e) => {
          if (window.innerWidth <= 768) {
            e.preventDefault();
            servicesDropdown.classList.toggle('active');
            
            // Toggle chevron icon
            if (chevronIcon) {
              chevronIcon.classList.toggle('fa-chevron-down');
              chevronIcon.classList.toggle('fa-chevron-up');
            }
          }
        });

        // Close when clicking outside
        document.addEventListener('click', (e) => {
          // For desktop
          if (window.innerWidth > 768 && servicesClicked && !e.target.closest('.services-dropdown')) {
            servicesClicked = false;
            desktopContent.style.display = 'none';
            if (chevronIcon) {
              chevronIcon.classList.add('fa-chevron-down');
              chevronIcon.classList.remove('fa-chevron-up');
            }
          }
          
          // For mobile
          if (!e.target.closest('.services-dropdown') && window.innerWidth <= 768) {
            servicesDropdown.classList.remove('active');
            if (chevronIcon) {
              chevronIcon.classList.add('fa-chevron-down');
              chevronIcon.classList.remove('fa-chevron-up');
            }
          }
        });
      }
    });
</script>
</body>
</html>
